name: E2E Test
description: 'E2E against workspace Nx. Node matrix from https://nx.dev/docs/technologies/node/introduction'

on: workflow_call

jobs:
  e2e-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Nx 22.x — all Node versions from Nx docs (update when workspace major changes)
        node-version: [20, 22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - run: npx nx e2e ngx-deploy-npm-e2e --configuration="ci"
