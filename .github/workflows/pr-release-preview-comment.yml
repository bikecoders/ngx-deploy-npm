name: PR Release Preview Comment

on:
  workflow_run:
    workflows: ['PR Release Preview']
    types: [completed]

jobs:
  post-comment:
    name: Post release preview comment
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Download release preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'release-preview-comment';
            const previewRunId = context.payload.workflow_run.id;
            console.log(
              `Downloading artifact from PR Release Preview run ${previewRunId} (head ${context.payload.workflow_run.head_sha})`
            );

            const allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: previewRunId,
            });
            console.log(
              'Available artifacts:',
              allArtifacts.data.artifacts.map((artifact) => artifact.name)
            );

            const matchArtifact = allArtifacts.data.artifacts.find(
              (artifact) => artifact.name === artifactName
            );

            if (!matchArtifact) {
              throw new Error(`Artifact "${artifactName}" not found on run ${previewRunId}`);
            }

            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
            });

            const fs = require('fs');
            fs.writeFileSync(
              `${process.env.GITHUB_WORKSPACE}/${artifactName}.zip`,
              Buffer.from(download.data)
            );

      - name: Extract release preview comment
        run: unzip release-preview-comment.zip

      - name: Find existing preview comment
        uses: peter-evans/find-comment@v4
        id: find-comment
        with:
          issue-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          comment-author: github-actions[bot]
          body-includes: ngx-deploy-npm-release-preview

      - name: Create or update preview comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          edit-mode: replace
          body-path: comment.md
