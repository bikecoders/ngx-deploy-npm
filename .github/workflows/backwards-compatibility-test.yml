name: Backwards Compatibility Test
description: 'Test backwards compatibility with different Nx versions and Node versions. Node support per Nx major: https://nx.dev/docs/technologies/node/introduction'

on: workflow_call

jobs:
  backwards-compatibility-test:
    strategy:
      matrix:
        include:
          # '' = current workspace version (23.x) — all Node versions from Nx docs
          - nx-version: '' # 23.x
            node-version: 26
          - nx-version: ''
            node-version: 24
          - nx-version: ''
            node-version: 22

          # previous = npm dist-tag (22.x) — all Node versions from Nx docs
          - nx-version: 'previous' # 22.x
            node-version: 26
          - nx-version: 'previous'
            node-version: 24
          - nx-version: 'previous'
            node-version: 22
          - nx-version: 'previous'
            node-version: 20

          # minimum supported (19.x) — latest installable 19.x (19.8.15 is deprecated)
          - nx-version: '19.8.14' # 19.x
            node-version: 22
          - nx-version: '19.8.14'
            node-version: 20
          - nx-version: '19.8.14'
            node-version: 18

    name: Backwards Compatibility Test
    uses: ./.github/workflows/smoke-test-nx-workspace.yml
    with:
      nx-version: ${{matrix.nx-version}}
      node-version: ${{matrix.node-version}}
